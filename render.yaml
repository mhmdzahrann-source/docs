services:
  - type: web
    name: instagram-comment-dm-automation
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: INSTAGRAM_ACCESS_TOKEN
        sync: false
      - key: INSTAGRAM_BUSINESS_ACCOUNT_ID
        sync: false
      - key: FACEBOOK_APP_SECRET
        sync: false
      - key: WEBHOOK_VERIFY_TOKEN
        sync: false
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: OWNER_WHATSAPP_NUMBER
        sync: false
      - key: BUSINESS_NAME
        value: Khayal
      - key: BUSINESS_TIMEZONE
        value: Asia/Riyadh
      - key: DATABASE_URL
        value: sqlite:////app/data/app.db
    disk:
      name: data
      mountPath: /app/data
      sizeGB: 1
